name: Continuous Integration

on:
  pull_request:
    branches: ["*"]
  push:
    # branches: ["main"]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch (full)
        uses: actions/checkout@v2
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: adopt
          java-version: 17

      - name: Generate artifacts
        run: |
          ./mill -i __.publishArtifacts

      - name: Publish ${{ github.ref }}
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
              ./mill -i \
              mill.contrib.sonatypecentral.SonatypeCentralPublishModule/publishAll \
              --username $SONATYPE_USERNAME \
              --password $SONATYPE_PASSWORD \
              --gpgArgs --no-tty,--pinentry-mode,loopback,--batch,--yes,-a,-b \
              --publishArtifacts __.publishArtifacts \
              --readTimeout  36000 \
              --awaitTimeout 36000 \
              --connectTimeout 36000 \
              --shouldRelease true
        env:
          MILL_PGP_SECRET_BASE64: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.CENTRAL_SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.CENTRAL_SONATYPE_USERNAME }}
